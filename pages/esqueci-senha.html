<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conexão Redação - Recuperar senha</title>
    <link rel="stylesheet" href="/Projeto-TCC/pages/static/css/esqueci-senha.css" />
    <link rel="stylesheet" href="/Projeto-TCC/pages/static/css/shell.css" />
  </head>
  <body>
    <main class="access-page">
      <section class="access-card recovery-card">
        <header>
          <span class="material-symbols-rounded recovery-icon" aria-hidden="true">lock_reset</span>
          <h1>Esqueci minha senha</h1>
          <p>Informe seu e-mail para receber as instruções de recuperação.</p>
        </header>

        <form class="access-form" action="/Projeto-TCC/pages/login.html" method="get">
          <label class="access-field">
            <span class="material-symbols-rounded field-icon" aria-hidden="true">mail</span>
            <input type="email" placeholder="E-mail" aria-label="E-mail" required />
          </label>

          <button class="button primary access-submit" type="submit">Enviar instruções</button>
        </form>

        <p class="access-alternative">
          Lembrou sua senha?
          <a class="switch-access" href="/Projeto-TCC/pages/login.html">Voltar para entrar</a>
        </p>
      </section>
    </main>
  </body>
</html>
