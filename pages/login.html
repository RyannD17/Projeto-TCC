<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conexão Redação - Acesso</title>
    <link rel="stylesheet" href="/Projeto-TCC/pages/static/css/login.css" />
    <link rel="stylesheet" href="/Projeto-TCC/pages/static/css/shell.css" />
    <script src="/Projeto-TCC/pages/static/js/app.js" defer></script>
  </head>
  <body>
    <main class="access-page">
      <section class="access-card login">
        <header>
          <h1>Bem Vindo de Volta</h1>
          <p>Sua Escrita, com mais apoio</p>
        </header>
        <form class="access-form" action="/Projeto-TCC/pages/tela-inicial.html" method="get">
          <label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">mail</span
            ><input type="email" placeholder="E-mail" aria-label="E-mail"
          /></label>
          <label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">lock</span
            ><input type="password" placeholder="Senha" aria-label="Senha" /><button
              type="button"
              class="password-toggle"
              aria-label="Mostrar senha"
            >
              <span class="material-symbols-rounded toggle-icon" aria-hidden="true"
                >visibility_off</span
              >
            </button></label
          ><a class="forgot" href="/Projeto-TCC/pages/esqueci-senha.html">Esqueci a minha senha</a
          ><button class="button primary access-submit">Entrar</button>
        </form>
        <p class="access-alternative">
          Não tem uma conta?
          <a class="switch-access" href="/Projeto-TCC/pages/cadastro.html">Cadastre-se</a>
        </p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
