<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conexão Redação - Cadastro</title>
    <link rel="stylesheet" href="/static/css/cadastro.css" />
    <link rel="stylesheet" href="/static/css/shell.css" />
    <script src="/static/js/app.js" defer></script>
  </head>
  <body>
    <main class="access-page">
      <section class="access-card register">
        <header>
          <h1>Conexão Redação</h1>
          <p>Seja Bem-vindo</p>
        </header>
        <form class="access-form" action="/tela-inicial.html" method="get">
          <label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">person</span
            ><input placeholder="Nome" /></label
          ><label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">phone</span
            ><input placeholder="Telefone" /></label
          ><label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">mail</span
            ><input type="email" placeholder="E-mail" aria-label="E-mail"
          /></label>
          <label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">lock</span
            ><input type="password" placeholder="Senha" aria-label="Senha" /><button
              type="button"
              class="password-toggle"
              aria-label="Mostrar senha"
            >
              <span class="material-symbols-rounded toggle-icon" aria-hidden="true"
                >visibility_off</span
              >
            </button></label
          ><label class="access-field"
            ><span class="material-symbols-rounded field-icon" aria-hidden="true">lock</span
            ><input type="password" placeholder="Confirmar senha" /><button
              type="button"
              class="password-toggle"
            >
              <span class="material-symbols-rounded toggle-icon" aria-hidden="true"
                >visibility_off</span
              >
            </button></label
          ><button class="button primary access-submit">Cadastrar</button>
        </form>
        <p class="access-alternative">
          Já tem uma conta?
          <a class="switch-access" href="/">Entrar</a>
        </p>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
